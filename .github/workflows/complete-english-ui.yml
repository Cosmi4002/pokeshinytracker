            ['src/pages/Bingo.tsx', 'Premi Regenerate.', 'Press Regenerate.'],
            ['src/pages/Bingo.tsx', 'Premi Rigenera.', 'Press Regenerate.'],
            ['src/pages/Bingo.tsx', '{progress}% completato', '{progress}% complete'],
