            ['src/pages/PokedexManager.tsx', 'Filtro Collezione', 'Collection Filter'],
            ['src/pages/PokedexManager.tsx', 'Default gioco', 'Default game'],
            ['src/pages/PokemonDetails.tsx', "details.hasGenderDifference ? 'Maschio'", "details.hasGenderDifference ? 'Male'"],
            ['src/pages/PokemonDetails.tsx', "displayName: 'Femmina'", "displayName: 'Female'"],
            ['src/pages/PokemonDetails.tsx', 'title="Maschio"', 'title="Male"'],
            ['src/pages/PokemonDetails.tsx', 'title="Femmina"', 'title="Female"'],
