            ['src/pages/Counter.tsx', '{activeHunts.length}/{MAX_ACTIVE_COUNTERS} attive', '{activeHunts.length}/{MAX_ACTIVE_COUNTERS} active'],
            ['src/pages/Counter.tsx', '{remainingSlots} libere', '{remainingSlots} free'],
            ['src/pages/Counter.tsx', 'Tieni le cacce attive in vista e apri il focus quando devi configurare i dettagli.', 'Keep active hunts in view and open focus mode when you need to configure details.'],
            ['src/pages/Counter.tsx', 'Torna alla vista Multipla', 'Back to multi view'],
            ['src/pages/Counter.tsx', 'Configura Pokemon e metodo', 'Configure Pokémon and method'],
            ['src/pages/Pokedex.tsx', '{totalCaughtCount} Pokémon catturati', '{totalCaughtCount} Pokémon caught'],
            ['src/pages/Pokedex.tsx', 'placeholder="Generazione"', 'placeholder="Generation"'],
            ['src/pages/Pokedex.tsx', '>Tutti<', '>All<'],
            ['src/pages/PokedexManager.tsx', 'Gestione card salvata', 'Card settings saved'],
            ['src/pages/PokedexManager.tsx', 'Torna al Pokedex', 'Back to Pokedex'],
