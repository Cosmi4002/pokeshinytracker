name: Complete English UI

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/complete-english-ui.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply remaining English translations
