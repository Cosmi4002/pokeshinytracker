            ['src/pages/Stats.tsx', 'shiny principali, {numberFormatter.format(stats.uniqueSpecies)} specie uniche', 'main shinies, {numberFormatter.format(stats.uniqueSpecies)} unique species'],
            ['src/pages/Stats.tsx', '>forme<', '>forms<'],
            ['src/pages/Stats.tsx', 'Nessuna data valida registrata.', 'No valid dates recorded.'],
            ['src/pages/UserCollectionsSearch.tsx', 'Collezione di @{selectedProfile.username}', "@{selectedProfile.username}'s Collection"],
            ['src/pages/UserCollectionsSearch.tsx', 'shiny principali, {numberFormatter.format(userStats.speciesCount)} specie uniche', 'main shinies, {numberFormatter.format(userStats.speciesCount)} unique species'],
            ['src/pages/UserCollectionsSearch.tsx', '>forme<', '>forms<'],
          ];
          const touched = new Set();
          const missing = [];
          for (const [file, from, to] of replacements) {
            let text = fs.readFileSync(file, 'utf8');
            if (text.includes(to) && !text.includes(from)) continue;
            if (!text.includes(from)) { missing.push(`${file}: ${from}`); continue; }
            text = text.split(from).join(to);
            fs.writeFileSync(file, text);
            touched.add(file);
          }
          if (missing.length) {
            console.error('Missing expected strings:');
            for (const item of missing) console.error(item);
            process.exit(1);
          }
          console.log(`Updated ${touched.size} files.`);
          NODE

      - name: Commit final source changes and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm --ignore-unmatch .github/workflows/complete-english-ui.yml
          git add src
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Complete English UI translation"
          git push
