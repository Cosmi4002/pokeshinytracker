<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">Gigamax Mark</title>
  <desc id="desc">Sword/Shield Gigantamax style mark</desc>
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff4fb8"/>
      <stop offset="0.55" stop-color="#ff2b6d"/>
      <stop offset="1" stop-color="#d10a43"/>
    </linearGradient>
    <linearGradient id="g2" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7a001f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#24000d" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.25" result="b"/>
      <feColorMatrix in="b" type="matrix"
        values="1 0 0 0 0
                0 0.25 0 0 0
                0 0 0.55 0 0
                0 0 0 0.85 0" result="c"/>
      <feMerge>
        <feMergeNode in="c"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer dark border -->
  <path
    fill="#14000a"
    d="M12 7h10l10 13L42 7h10L39 25l14 20H41L32 33 23 45H11l14-20z"
    opacity="0.95"
  />

  <!-- Main mark -->
  <path
    fill="url(#g1)"
    filter="url(#softGlow)"
    d="M15 9h8l9 12 9-12h8L38 25l12 18h-9L32 31 23 43h-9l12-18z"
  />

  <!-- Inner dark shading -->
  <path
    fill="url(#g2)"
    opacity="0.9"
    d="M22 14h3.8L32 22.2 38.2 14H42l-7.5 11 8.3 12h-3.8L32 27.4 25 37h-3.8l8.3-12z"
  />

  <!-- Small highlights -->
  <path
    fill="#ffd1e8"
    opacity="0.35"
    d="M19 11h2.8l7.3 9.6-1.8 2.5L19 12.7zM45 11h-2.8l-7.3 9.6 1.8 2.5L45 12.7z"
  />
</svg>
